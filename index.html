<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Legal information for FraudArchive.">
  <title>FraudArchive Legal</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d10;
      --panel: #111419;
      --border: #232832;
      --text: #f4f6f8;
      --muted: #9aa4b2;
      --accent: #6ea8fe;
      --accent-hover: #8bb9ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      width: min(760px, calc(100% - 40px));
      margin: 0 auto;
      padding: 96px 0;
    }

    .brand {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(36px, 7vw, 56px);
      line-height: 1.05;
      letter-spacing: -0.035em;
      font-weight: 700;
    }

    .lead {
      margin: 0;
      max-width: 620px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
    }

    .links {
      display: grid;
      gap: 12px;
      margin-top: 42px;
    }

    .legal-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 22px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      transition: border-color 160ms ease, background 160ms ease;
    }

    .legal-link:hover {
      border-color: #394150;
      background: #14181e;
    }

    .legal-link strong {
      font-size: 15px;
      font-weight: 600;
    }

    .legal-link span {
      color: var(--muted);
      font-size: 14px;
    }

    footer {
      margin-top: 54px;
      padding-top: 22px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--accent-hover);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">FraudArchive</div>

    <h1>Legal</h1>

    <p class="lead">
      Terms, privacy information, and contact details for the FraudArchive platform and Discord bot.
    </p>

    <div class="links">
      <a class="legal-link" href="./terms/">
        <strong>Terms of Service</strong>
        <span>Usage rules and service terms</span>
      </a>

      <a class="legal-link" href="./privacy/">
        <strong>Privacy Policy</strong>
        <span>How information is handled</span>
      </a>
    </div>

    <footer>
      Official support and report server:
      <a href="https://discord.gg/TeUDyUsRY">discord.gg/TeUDyUsRY</a>
    </footer>
  </main>
</body>
</html>
